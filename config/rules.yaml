# ---------------------------------------------------------------------------
# MigrateRight data-quality rules  (business-editable: no code change needed)
#
# Case study sources (all real, public):
#   customer = Olist customers (Brazil)     vendor = Olist sellers (Brazil)
#   material = Online Retail II stock codes (UK)
#
# Each object lists:
#   key            legacy primary key
#   mandatory      fields that must be filled, else record -> quarantine
#   formats        regex checks, applied only when the field is filled
#   max_length     target field lengths in S/4HANA (longer -> quarantine)
#   allowed_values field -> list of allowed values
#   address        check zip prefix / city / state against the geolocation reference
#   obsolete       when a legacy record is out of scope (not migrated)
#   dedup          how duplicates are found and which record survives
# Reason codes written to the quarantine table are shown in [brackets].
#
# NOT APPLICABLE to this source: e-mail, phone, name and tax-number rules.
# Olist publishes no names, e-mails, phones or CPF/CNPJ tax numbers (anonymised),
# so those rules are not configured. In a real ECC extract they would be:
#   EMAIL: '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'   TELF1: E.164 '^\+[1-9][0-9]{8,14}$'
# ---------------------------------------------------------------------------

brazil_states: &UF [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR,
                    RJ, RN, RO, RR, RS, SC, SE, SP, TO]

customer:
  key: KUNNR
  mandatory: [KUNNR, UNIQUE_ID, PSTLZ, ORT01, REGIO]                 # [MISSING_MANDATORY]
  formats:
    PSTLZ: {regex: '^[0-9]{5}$', reason: INVALID_POSTAL_CODE}       # 5-digit CEP prefix
  max_length: {ORT01: 40}                                           # [FIELD_TOO_LONG]
  allowed_values:
    REGIO: {values: *UF, reason: INVALID_STATE}
  address:
    zip_field: PSTLZ
    city_field: ORT01
    state_field: REGIO
    city_fuzzy_threshold: 85         # rapidfuzz ratio to accept a misspelt city
    # [ZIP_NOT_FOUND] zip prefix not in the reference, [ZIP_STATE_MISMATCH] zip belongs to
    # another state, [CITY_ZIP_MISMATCH] city is not a city of that zip prefix
  obsolete:                                                          # [OBSOLETE]
    last_activity_field: LAST_ACTIVITY
    cutoff_date: "2017-01-01"        # no order since then -> not migrated
  dedup:
    method: exact
    key: UNIQUE_ID                   # legacy cross-reference: many customer_ids, one real customer
    survivorship: [LAST_ACTIVITY]    # newest order = most recent address survives
  location_matcher:                  # evaluated against UNIQUE_ID, NOT used to merge (see README)
    block_on: PSTLZ
    city_field: CITY_STD
    city_threshold: 90

vendor:
  key: LIFNR
  mandatory: [LIFNR, PSTLZ, ORT01, REGIO]
  formats:
    PSTLZ: {regex: '^[0-9]{5}$', reason: INVALID_POSTAL_CODE}
  max_length: {ORT01: 40}
  allowed_values:
    REGIO: {values: *UF, reason: INVALID_STATE}
  address:
    zip_field: PSTLZ
    city_field: ORT01
    state_field: REGIO
    city_fuzzy_threshold: 85
  obsolete:
    last_activity_field: LAST_ACTIVITY
    cutoff_date: "2017-07-01"        # no sale in the last ~14 months of the extract
  dedup:
    method: none                     # seller_id is unique; no name/tax id to match on

material:
  key: MATNR
  mandatory: [MATNR, MAKTX, MEINS]
  formats:
    # A real product description has at least 3 letters and is not a lower-case
    # stock-adjustment note ("damaged", "wet/rusty", "?") typed into the legacy field.
    MAKTX: {regex: '^(?=(?:.*[A-Za-z]){3})(?!^[^A-Z]*$).+$', reason: INVALID_DESCRIPTION}
  max_length: {MATNR: 40, MAKTX: 40}
  allowed_values:
    MEINS: {values: [PC, SET, PAC], reason: INVALID_UOM}
  min_value:
    STPRS: {min: 0.01, reason: MISSING_PRICE}   # no positive sales price ever recorded
  non_product_codes:                            # postage, fees, adjustments, tests [NON_PRODUCT]
    reason: NON_PRODUCT
    field: MATNR
    patterns: ['^POST$', '^DOT$', '^C2$', '^M$', '^D$', '^S$', '^B$', '^CRUK$', '^PADS$',
               '^C3$', '^GIFT$', '^BANK CHARGES$', '^AMAZONFEE$', '^ADJUST', '^TEST', '^GIFT_']
  obsolete:
    last_activity_field: LAST_SOLD
    cutoff_date: "2010-12-01"        # not sold in the final 12 months of the extract
  dedup:
    method: exact
    key: MATNR                       # legacy codes differing only in case (85123A vs 85123a)
    survivorship: [TXN_COUNT]        # the code with the most sales history survives
