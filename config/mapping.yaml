# ---------------------------------------------------------------------------
# MigrateRight field & value mapping: legacy SAP ECC -> SAP S/4HANA
#
#   Customer (KNA1) and Vendor (LFA1) both become a Business Partner:
#     BUT000  BP general data (one row per partner)
#     BUT020  BP -> address link
#     ADRC    address (simplified: phone/e-mail kept here; in S/4 they sit in ADR2/ADR6)
#     BUT100  BP roles: FLCU01 = customer, FLVN01 = vendor
#     CVI_CUST_LINK / CVI_VEND_LINK  legacy number -> BP (Customer-Vendor Integration)
#   Material (MARA/MAKT in ECC) stays a product master in S/4HANA:
#     MARA general data, MAKT description, MBEW valuation (standard price)
#
# Column spec:  {source: FIELD}  copy a cleansed legacy field
#               {constant: X}    fixed value
#               {generated: partner | address}  number assigned by the loader
#               value_map: NAME  translate through value_maps below
# ---------------------------------------------------------------------------

# Value maps are applied during cleansing (before validation), so "UK" is fixed
# to "GB" instead of being rejected. Keys are compared in UPPER CASE.
value_maps:
  country:
    UK: GB
    UNITED KINGDOM: GB
    GREAT BRITAIN: GB
    GBR: GB
    ENGLAND: GB
    GERMANY: DE
    DEUTSCHLAND: DE
    DEU: DE
    FRANCE: FR
    FRA: FR
    NETHERLANDS: NL
    HOLLAND: NL
    NLD: NL
    SPAIN: ES
    ESP: ES
    ESPANA: ES
    IRELAND: IE
    EIRE: IE
    IRL: IE
    USA: US
    UNITED STATES: US
    U.S.A.: US
    INDIA: IN
    IND: IN
  uom:            # ECC internal (German) unit keys -> S/4HANA ISO-style units
    ST: PC        # Stueck = piece
    STK: PC
    EA: PC
    SET: SET
    PAK: PAC      # Packung = pack
  customer_account_group:   # ECC KNA1-KTOKD -> BP grouping
    Z001: BPCU    # domestic customer
    Z002: BPCU    # export customer
  vendor_account_group:     # ECC LFA1-KTOKK -> BP grouping
    Z100: BPVN    # trade vendor
    Z200: BPVN    # service vendor
  material_type:            # derived legacy MTART -> S/4HANA product type
    HAWA: HAWA    # trading goods
    DIEN: DIEN    # service

# Which legacy fields get a value map during cleansing
cleanse_value_maps:
  customer: {LAND1: country}
  vendor: {LAND1: country}
  material: {MEINS: uom}

objects:
  customer:
    role: FLCU01
    link_table: CVI_CUST_LINK
    link_field: KUNNR
    tables:
      BUT000:
        PARTNER: {generated: partner}
        BU_TYPE: {constant: "2"}                 # 2 = organisation
        BU_GROUP: {source: KTOKD, value_map: customer_account_group}
        NAME_ORG1: {source: NAME1}
        NAME_ORG2: {source: NAME2}
        BPEXT: {source: KUNNR}                   # legacy number kept for traceability
        CRDAT: {source: ERDAT}
      BUT020:
        PARTNER: {generated: partner}
        ADDRNUMBER: {generated: address}
      ADRC:
        ADDRNUMBER: {generated: address}
        NAME1: {source: NAME1}
        STREET: {source: STRAS}
        CITY1: {source: ORT01}
        POST_CODE1: {source: PSTLZ}
        COUNTRY: {source: LAND1}
        TEL_NUMBER: {source: TELF1}
        SMTP_ADDR: {source: EMAIL}

  vendor:
    role: FLVN01
    link_table: CVI_VEND_LINK
    link_field: LIFNR
    tables:
      BUT000:
        PARTNER: {generated: partner}
        BU_TYPE: {constant: "2"}
        BU_GROUP: {source: KTOKK, value_map: vendor_account_group}
        NAME_ORG1: {source: NAME1}
        NAME_ORG2: {source: NAME2}
        BPEXT: {source: LIFNR}
        CRDAT: {source: ERDAT}
      BUT020:
        PARTNER: {generated: partner}
        ADDRNUMBER: {generated: address}
      ADRC:
        ADDRNUMBER: {generated: address}
        NAME1: {source: NAME1}
        STREET: {source: STRAS}
        CITY1: {source: ORT01}
        POST_CODE1: {source: PSTLZ}
        COUNTRY: {source: LAND1}
        TEL_NUMBER: {source: TELF1}
        SMTP_ADDR: {source: EMAIL}

  material:
    tables:
      MARA:
        MATNR: {source: MATNR}                   # S/4HANA allows 40-char material numbers
        MTART: {source: MTART, value_map: material_type}
        MEINS: {source: MEINS}
        BISMT: {source: MATNR_LEGACY}            # "old material number" = legacy code as typed
        ERSDA: {source: ERSDA}
      MAKT:
        MATNR: {source: MATNR}
        SPRAS: {constant: "E"}                   # language key English
        MAKTX: {source: MAKTX}
      MBEW:
        MATNR: {source: MATNR}
        BWKEY: {constant: "UK01"}                # valuation area (plant) of the target system
        STPRS: {source: STPRS}
        PEINH: {constant: 1}                     # price unit
