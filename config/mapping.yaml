# ---------------------------------------------------------------------------
# MigrateRight field & value mapping: legacy ECC-style extract -> SAP S/4HANA
#
#   Customer (KNA1) and Vendor (LFA1) both become a Business Partner:
#     BUT000  BP general data (one row per partner)
#     BUT020  BP -> address link
#     ADRC    address
#     BUT100  BP roles: FLCU01 = customer, FLVN01 = vendor
#     CVI_CUST_LINK / CVI_VEND_LINK  legacy number -> BP (Customer-Vendor Integration)
#   Material (MARA/MAKT in ECC) stays a product master in S/4HANA:
#     MARA general data, MAKT description, MBEW valuation (standard price)
#
# Column spec:  {source: FIELD}           copy a cleansed legacy field
#               {constant: X}             fixed value
#               {generated: partner | address}  number assigned by the loader
#               {not_in_source: "why"}    target field left EMPTY - the case-study source
#                                         does not have it; it would come from the legacy system
#               value_map: NAME           translate through value_maps below
# Nothing is invented: Olist is anonymised, so names, street, phone, e-mail and
# tax numbers stay empty in the target and are listed in the README.
# ---------------------------------------------------------------------------

value_maps:
  uom:            # ECC internal (German) unit keys -> S/4HANA ISO-style units
    ST: PC        # Stueck = piece
    STK: PC
    EA: PC
    SET: SET
    PAK: PAC      # Packung = pack
  material_type:  # derived legacy MTART -> S/4HANA product type
    HAWA: HAWA    # trading goods
    DIEN: DIEN    # service

# Which legacy fields get a value map during cleansing
cleanse_value_maps:
  material: {MEINS: uom}

objects:
  customer:
    role: FLCU01
    link_table: CVI_CUST_LINK
    link_field: KUNNR
    tables:
      BUT000:
        PARTNER: {generated: partner}
        BU_TYPE: {constant: "1"}                 # 1 = person (Olist customers are consumers)
        BU_GROUP: {constant: "BPCU"}             # BP grouping for customers
        NAME_FIRST: {not_in_source: "KNA1-NAME1 in the real legacy system (anonymised in Olist)"}
        NAME_LAST: {not_in_source: "KNA1-NAME1 in the real legacy system (anonymised in Olist)"}
        NAME_ORG1: {not_in_source: "organisations only"}
        BPEXT: {not_in_source: "CHAR 20 - Olist ids are 32-char hashes; kept in CVI_CUST_LINK"}
        CRDAT: {source: ERDAT}
      BUT020:
        PARTNER: {generated: partner}
        ADDRNUMBER: {generated: address}
      ADRC:
        ADDRNUMBER: {generated: address}
        STREET: {not_in_source: "KNA1-STRAS (not published by Olist)"}
        CITY1: {source: CITY_STD}                # city standardised against geolocation
        POST_CODE1: {source: PSTLZ}              # 5-digit CEP prefix; full 8-digit CEP not in source
        REGION: {source: REGIO}
        COUNTRY: {constant: "BR"}
        TEL_NUMBER: {not_in_source: "KNA1-TELF1 (not published by Olist)"}
        SMTP_ADDR: {not_in_source: "ADR6-SMTP_ADDR (not published by Olist)"}

  vendor:
    role: FLVN01
    link_table: CVI_VEND_LINK
    link_field: LIFNR
    tables:
      BUT000:
        PARTNER: {generated: partner}
        BU_TYPE: {constant: "2"}                 # 2 = organisation (sellers are companies)
        BU_GROUP: {constant: "BPVN"}             # BP grouping for vendors
        NAME_FIRST: {not_in_source: "persons only"}
        NAME_LAST: {not_in_source: "persons only"}
        NAME_ORG1: {not_in_source: "LFA1-NAME1 in the real legacy system (anonymised in Olist)"}
        BPEXT: {not_in_source: "CHAR 20 - Olist ids are 32-char hashes; kept in CVI_VEND_LINK"}
        CRDAT: {source: ERDAT}
      BUT020:
        PARTNER: {generated: partner}
        ADDRNUMBER: {generated: address}
      ADRC:
        ADDRNUMBER: {generated: address}
        STREET: {not_in_source: "LFA1-STRAS (not published by Olist)"}
        CITY1: {source: CITY_STD}
        POST_CODE1: {source: PSTLZ}
        REGION: {source: REGIO}
        COUNTRY: {constant: "BR"}
        TEL_NUMBER: {not_in_source: "LFA1-TELF1 (not published by Olist)"}
        SMTP_ADDR: {not_in_source: "ADR6-SMTP_ADDR (not published by Olist)"}

  material:
    tables:
      MARA:
        MATNR: {source: MATNR}                   # S/4HANA allows 40-char material numbers
        MTART: {source: MTART, value_map: material_type}
        MEINS: {source: MEINS}
        BISMT: {source: MATNR_LEGACY}            # "old material number" = legacy code as typed
        ERSDA: {source: ERSDA}
      MAKT:
        MATNR: {source: MATNR}
        SPRAS: {constant: "E"}                   # language key English
        MAKTX: {source: MAKTX}
      MBEW:
        MATNR: {source: MATNR}
        BWKEY: {constant: "UK01"}                # valuation area (plant) of the target system
        STPRS: {source: STPRS}
        PEINH: {constant: 1}                     # price unit
